name: Release Management
on:
  pull_request:
    types:
      - opened
      - labeled
      - unlabeled
      - synchronize
      - reopened
  milestone:
    types:
      - closed
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
jobs:
  release-managment:
    name: Release Management
    secrets: inherit
    uses: WyriHaximus/github-workflows/.github/workflows/github-action-release-managment.yaml@4669e1c809880ce23cfce71a2c489e37b758011a # main
    with:
      milestone: ${{ github.event.milestone.title }}
      description: ${{ github.event.milestone.description }}
      mustCreateCommit: true
      preReleaseScript: |
        sed -i 's/master/${{ matrix.version }}/g' Dockerfile
        cat Dockerfile
        git add Dockerfile
